<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In · Drive2Doc</title>

  <style>
    :root {
      --navy: #183b55;
      --teal: #2f7569;
      --orange: #c96a3b;
      --ink: #33454f;
      --muted: #62717a;
      --line: #d5dfe4;
      --page: #f4f6f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 22px;
      background: var(--page);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .shell {
      width: min(920px, 100%);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0 20px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      color: var(--navy);
      font-size: 29px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand span {
      color: var(--orange);
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .account-button {
      display: inline-block;
      padding: 10px 15px;
      border: 1px solid var(--navy);
      border-radius: 7px;
      background: white;
      color: var(--navy);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .notification-dot {
      display: none;
      min-width: 18px;
      height: 18px;
      margin-left: 5px;
      padding: 0 5px;
      border-radius: 9px;
      background: var(--teal);
      color: white;
      text-align: center;
      line-height: 18px;
      font-size: 11px;
      font-weight: 800;
    }

    .card {
      width: min(440px, 100%);
      margin: 54px auto 0;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: white;
      box-shadow: 0 6px 22px rgba(31, 57, 73, .08);
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: 28px;
      letter-spacing: -0.6px;
    }

    .intro {
      margin: 9px 0 23px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    label {
      display: block;
      margin-top: 15px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      margin-top: 7px;
      padding: 12px;
      border: 1px solid #bbc9cf;
      border-radius: 7px;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
    }

    input:focus {
      outline: 3px solid rgba(47, 117, 105, .18);
      border-color: var(--teal);
    }

    .submit-button {
      width: 100%;
      margin-top: 24px;
      padding: 13px 16px;
      border: 1px solid var(--teal);
      border-radius: 7px;
      background: var(--teal);
      color: white;
      cursor: pointer;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 7px;
      font-size: 14px;
      line-height: 1.45;
    }

    .message.error {
      display: block;
      border: 1px solid #ebc5bb;
      background: #fff0ed;
      color: #8c3320;
    }

    @media (max-width: 620px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="shell">
    <header>
      <div>
        <div class="brand">Drive<span>2</span>Doc</div>
        <div class="subtitle">Sign in to continue</div>
      </div>

      
      <div class="header-actions">
         <a class="account-button" href="/">Home</a>

         <a
          id="notifications-link"
          class="account-button"
          href="/notifications"
          hidden
        >
          Notifications
          <span id="notification-dot" class="notification-dot"></span>
        </a>

        <a
          id="profile-link"
          class="account-button"
          href="/profile"
          hidden
        >
          Profile &amp; settings
        </a>

        <a
          id="sign-in-link"
          class="account-button"
          href="/sign-in"
        >
          Sign in
        </a>

        <button
          id="sign-out-button"
          class="account-button"
          type="button"
          hidden
        >
          Sign out
        </button>
      </div>
    </header>

    <section class="card">
      <h1>Welcome back</h1>

      <p class="intro">
        Sign in to request a ride, volunteer, or view ride updates.
      </p>

      <form id="sign-in-form" novalidate>
        <label>
          Full name
          <input
            id="name"
            required
            autocomplete="name"
            placeholder="Your name"
          >
        </label>

        <label>
          Email or phone number
          <input
            id="identity"
            required
            autocomplete="username"
            placeholder="you@example.com"
          >
        </label>

        <label>
          Password
          <input
            id="password"
            required
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
          >
        </label>

        <button class="submit-button" type="submit">Sign in</button>

        <div id="message" class="message" role="status"></div>
      </form>
    </section>
  </main>

  <script>
    const signedInUser = JSON.parse(
      localStorage.getItem("drive2doc_signed_in_user") || "null"
    );

    const notificationsLink = document.getElementById("notifications-link");
    const profileLink = document.getElementById("profile-link");
    const signInLink = document.getElementById("sign-in-link");
    const signOutButton = document.getElementById("sign-out-button");
    const notificationDot = document.getElementById("notification-dot");

    if (signedInUser && signedInUser.name) {
      notificationsLink.hidden = false;
      profileLink.hidden = false;
      signInLink.hidden = true;
      signOutButton.hidden = false;

      const notifications = JSON.parse(
        localStorage.getItem("drive2doc_notifications") || "[]"
      );

      const unreadCount = notifications.filter((notification) => {
        return (
          notification.recipientName === signedInUser.name &&
          !notification.read
        );
      }).length;

      if (unreadCount > 0) {
        notificationDot.style.display = "inline-block";
        notificationDot.textContent = unreadCount > 9 ? "9+" : unreadCount;
      }
    }

    signOutButton.addEventListener("click", () => {
      localStorage.removeItem("drive2doc_signed_in_user");
      window.location.href = "/";
    });

    const form = document.getElementById("sign-in-form");
    const message = document.getElementById("message");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const identity = document.getElementById("identity").value.trim();
      const password = document.getElementById("password").value;

      if (!name || !identity || !password) {
        message.textContent =
          "Complete your name, email or phone number, and password.";
        message.className = "message error";
        return;
      }

      localStorage.setItem(
        "drive2doc_signed_in_user",
        JSON.stringify({
          name,
          identity,
          password,
          signedInAt: new Date().toISOString()
        })
      );

      const destination =
        localStorage.getItem("drive2doc_after_sign_in") || "/";

      localStorage.removeItem("drive2doc_after_sign_in");
      window.location.href = destination;
    });
  </script>
</body>
</html>
